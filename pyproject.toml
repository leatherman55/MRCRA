[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mrrn"
version = "4.0.0"
description = "Multimodal Relational-Continuity Resonance Architecture reference implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
apple = ["mlx>=0.31,<0.33"]
train = [
    "datasets>=4.0,<5",
    "huggingface-hub>=1.0,<2",
    "psutil>=5.9",
    "trackio>=0.31,<0.32",
    "transformers>=5.0,<6",
]
cuda = ["nvidia-ml-py>=12.0"]
test = ["coverage>=7.6", "hypothesis>=6.100", "mpmath>=1.3", "pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mrrn = ["trackio_frontend/*", "trackio_frontend/assets/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mrrn"]
omit = ["src/mrrn/mlx_backend.py"]

[tool.coverage.report]
fail_under = 89
precision = 2
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
